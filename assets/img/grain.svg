<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <!-- حبيبات فيلم: ضجيج كسوري يولّده المتصفّح مرّة واحدة ثم يكرّره.
       أرخص بكثير من صورة PNG مُحمّلة، وبلا كلفة شبكة. -->
  <filter id="g" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.86" numOctaves="4" seed="7" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <rect width="180" height="180" filter="url(#g)"/>
</svg>
