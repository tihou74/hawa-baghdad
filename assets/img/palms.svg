<svg xmlns="http://www.w3.org/2000/svg" width="420" height="520" viewBox="0 0 420 520" aria-hidden="true">
  <!-- ======================================================================
       نخلتان — ظلّ لا رسم
       ----------------------------------------------------------------------
       تُستخدم خلف الواجهة بشفافيّة منخفضة، فالمطلوب صحّة الصورة الظلّيّة
       (silhouette) لا التفاصيل: جذع منحنٍ قليلاً، وتاج من سعف يتدلّى
       أطرافه. السعف مرسوم كمنحنيات مزدوجة لتبدو له سماكة عند القاعدة
       ورهافة عند الطرف.
       ====================================================================== -->
  <g fill="#0A1F26">
    <!-- النخلة الكبيرة -->
    <g>
      <!-- الجذع: حلقات الكرب مرسومة كتدرّج في العرض -->
      <path d="M150 520 C146 420, 142 330, 136 236 L158 234 C162 330, 164 420, 168 520 Z"/>
      <!-- حلقات الجذع -->
      <g fill="none" stroke="#0A1F26" stroke-width="2.4" opacity=".55">
        <path d="M138 270 L159 268"/><path d="M139 300 L161 298"/>
        <path d="M141 332 L163 330"/><path d="M143 366 L164 364"/>
        <path d="M145 402 L166 400"/>
      </g>
      <!-- التاج: تسع سعفات -->
      <g>
        <path d="M147 232 C108 206, 56 196, 14 212 C58 186, 112 188, 149 216 Z"/>
        <path d="M147 232 C112 190, 62 162, 18 158 C70 142, 122 172, 150 212 Z"/>
        <path d="M147 230 C130 182, 96 134, 56 108 C110 120, 142 170, 152 210 Z"/>
        <path d="M148 228 C146 176, 132 120, 112 74 C150 112, 160 172, 157 210 Z"/>
        <path d="M150 228 C162 178, 180 126, 206 86 C206 140, 180 186, 160 212 Z"/>
        <path d="M151 230 C172 190, 212 150, 258 124 C228 170, 184 204, 159 214 Z"/>
        <path d="M151 232 C180 206, 234 186, 284 182 C238 204, 190 220, 155 220 Z"/>
        <path d="M150 234 C182 224, 232 226, 276 242 C228 240, 184 240, 153 240 Z"/>
        <path d="M149 236 C128 232, 86 238, 48 254 C86 234, 124 226, 150 229 Z"/>
      </g>
      <!-- عراجين الرطب -->
      <g opacity=".8">
