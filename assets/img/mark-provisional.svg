<svg xmlns="http://www.w3.org/2000/svg" width="200" height="240" viewBox="0 0 200 240" role="img" aria-label="هوى بغداد">
  <!-- ======================================================================
       ⚠ شعار مبدئي — PROVISIONAL MARK
       ----------------------------------------------------------------------
       هذا ليس الشعار النهائي. العميل يملك الشعار الأصلي، وهذا الملف
       يحتلّ مكانه فقط حتى يُستبدل، كي لا تنتظر بقيّة البناء.
       للاستبدال: ضع الشعار في assets/img/logo.svg ثم بدّل المرجع في
       index.html و en/index.html و الذيل. لا شيء آخر يحتاج تعديلاً.

       الفكرة: شُنشول — نافذة بغداديّة مقوّسة، مشبّكها خشبي وعيونها
       زجاج ملوّن. القوس هو القوس البغدادي المدبّب (لا نصف دائرة).
       ====================================================================== -->
  <defs>
    <linearGradient id="m-wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8A5A33"/>
      <stop offset=".55" stop-color="#6B3F22"/>
      <stop offset="1" stop-color="#4A2A16"/>
    </linearGradient>
    <linearGradient id="m-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCBB69"/>
      <stop offset="1" stop-color="#C9A24A"/>
    </linearGradient>
    <!-- قناع القوس: كل ما بالداخل يُقصّ على شكل النافذة -->
    <clipPath id="m-arch">
      <path d="M100 8 C150 8, 176 54, 176 100 L176 222 L24 222 L24 100 C24 54, 50 8, 100 8 Z"/>
    </clipPath>
  </defs>

  <!-- زجاج النافذة: أربعة ألوان شُنشول في أربع حصص -->
  <g clip-path="url(#m-arch)">
    <rect x="24" y="0" width="76" height="115" fill="#E8A33D"/>
    <rect x="100" y="0" width="76" height="115" fill="#A8323C"/>
    <rect x="24" y="115" width="76" height="107" fill="#1F6B52"/>
    <rect x="100" y="115" width="76" height="107" fill="#2A5A8C"/>
    <!-- وهج دافئ من أسفل: الضوء الداخل من النافذة -->
    <ellipse cx="100" cy="222" rx="96" ry="78" fill="#DCBB69" opacity=".35"/>
  </g>

  <!-- المشبّك الخشبي: الشبكة المعينيّة فوق الزجاج -->
  <g clip-path="url(#m-arch)" fill="none" stroke="url(#m-wood)" stroke-width="7"
     stroke-linejoin="round" stroke-linecap="round">
    <path d="M100 26 L158 100 L100 174 L42 100 Z"/>
    <path d="M100 100 L158 174 L100 248 L42 174 Z"/>
    <path d="M100 -48 L158 26 L100 100 L42 26 Z"/>
    <!-- عمود وعتبة -->
    <path d="M100 8 L100 222"/>
    <path d="M24 100 L176 100"/>
    <path d="M24 174 L176 174"/>
  </g>

  <!-- إطار النافذة -->
  <path d="M100 8 C150 8, 176 54, 176 100 L176 222 L24 222 L24 100 C24 54, 50 8, 100 8 Z"
        fill="none" stroke="url(#m-wood)" stroke-width="11" stroke-linejoin="round"/>
  <!-- خطّ ذهبي رقيق داخل الإطار: حدّ الاستكان -->
  <path d="M100 8 C150 8, 176 54, 176 100 L176 222 L24 222 L24 100 C24 54, 50 8, 100 8 Z"
        fill="none" stroke="url(#m-gold)" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- نجمة ثمانيّة في قمّة القوس -->
  <path d="M100 44 L107 59 L122 66 L107 73 L100 88 L93 73 L78 66 L93 59 Z"
        fill="url(#m-gold)"/>

  <!-- العتبة -->
  <rect x="14" y="222" width="172" height="11" rx="3" fill="url(#m-wood)"/>
  <rect x="14" y="222" width="172" height="2.6" fill="url(#m-gold)" opacity=".75"/>
</svg>
