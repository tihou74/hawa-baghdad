<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!-- ======================================================================
       بلاطة الزرقاء والبيضاء — الموتيف الأساسي للعلامة
       ======================================================================
       مأخوذة من البلاط الذي يتكرّر في بروفايل الهويّة: الأزرق والأبيض
       الذي يُغطّي الجدران والصحون والمقاعد. وهو نسب مباشر إلى بلاط
       بلاد الرافدين — من بوّابة عشتار البابليّة ذات الآجر المزجَّج
       الأزرق، إلى القاشاني الذي كُسيت به العتبات والمراقد.

       بناء البلاطة
       =============
       شبكة ٨×٨ على ١٢٠ وحدة، فكل خطوة ١٥ وحدة. والنقش مبنيّ على
       النجمة الثمانيّة المتشابكة (الرُبع) مع الصليب المعقوف الزخرفي
       بينها — وهذا هو التكرار الكلاسيكي في القاشاني.

       شرط التكرار بلا انقطاع (seamless): كل عنصر يلمس حدّ البلاطة
       يجب أن يُكمله نظيره على الحدّ المقابل بنفس الإحداثي. ولذلك
       أنصاف النجوم على الحواف الأربع وأرباعها على الزوايا الأربع
       موضوعة على مضاعفات ٦٠ بالضبط.
       ====================================================================== 
  -->
  <defs>
    <!-- النجمة الثمانيّة: مربّعان متراكبان أحدهما مُدار ٤٥° -->
    <g id="star8">
      <path d="M0,-21 L5.6,-10.4 L16.3,-16.3 L10.4,-5.6 L21,0 L10.4,5.6
               L16.3,16.3 L5.6,10.4 L0,21 L-5.6,10.4 L-16.3,16.3 L-10.4,5.6
               L-21,0 L-10.4,-5.6 L-16.3,-16.3 L-5.6,-10.4 Z"/>
    </g>
    <!-- معيّن صغير يملأ ما بين النجوم -->
    <g id="dia">
      <path d="M0,-9 L9,0 L0,9 L-9,0 Z"/>
    </g>
  </defs>

  <!-- أرضيّة: أبيض مزجَّج دافئ، لا أبيض نقي — القاشاني ليس ناصعاً -->
  <rect width="120" height="120" fill="#F4F1E8"/>

  <!-- النجوم في مراكز الشبكة -->
  <g fill="#1F4E8C">
    <use href="#star8" x="60" y="60"/>
    <use href="#star8" x="0"  y="0"/>
    <use href="#star8" x="120" y="0"/>
    <use href="#star8" x="0"  y="120"/>
    <use href="#star8" x="120" y="120"/>
    <use href="#star8" x="60" y="0"/>
    <use href="#star8" x="60" y="120"/>
    <use href="#star8" x="0"  y="60"/>
    <use href="#star8" x="120" y="60"/>
  </g>

  <!-- المعيّنات: تُملأ بالفيروزي، وهو اللون الثاني في القاشاني -->
  <g fill="#3C8FA8">
    <use href="#dia" x="30" y="30"/>
    <use href="#dia" x="90" y="30"/>
    <use href="#dia" x="30" y="90"/>
    <use href="#dia" x="90" y="90"/>
  </g>

  <!-- الشبكة الرابطة: خطوط رقيقة تصل النجوم بالمعيّنات -->
  <g fill="none" stroke="#1F4E8C" stroke-width="1.6" opacity=".55">
    <path d="M60 39 L39 60 M60 81 L81 60 M60 39 L81 60 M60 81 L39 60"/>
    <path d="M0 39 L21 60 M0 81 L21 60 M120 39 L99 60 M120 81 L99 60"/>
    <path d="M39 0 L60 21 M81 0 L60 21 M39 120 L60 99 M81 120 L60 99"/>
    <!-- الإطار الشبكي -->
    <path d="M30 0 L30 120 M90 0 L90 120 M0 30 L120 30 M0 90 L120 90"
          stroke-width="0.9" opacity=".4"/>
  </g>

  <!-- نقاط طينيّة: اللمسة الطينيّة التي تكسر برودة الأزرق -->
  <g fill="#D65C45">
    <circle cx="30" cy="30" r="2.6"/>
    <circle cx="90" cy="30" r="2.6"/>
    <circle cx="30" cy="90" r="2.6"/>
    <circle cx="90" cy="90" r="2.6"/>
  </g>
</svg>
