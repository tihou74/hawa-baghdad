<svg xmlns="http://www.w3.org/2000/svg" width="820" height="260" viewBox="0 0 820 260" preserveAspectRatio="none">
  <!-- ======================================================================
       موج دجلة — بلاطة تكرار أفقي
       ----------------------------------------------------------------------
       الشرط الوحيد لتكرار بلا انقطاع: أن تبدأ كل موجة وتنتهي على نفس
       الارتفاع (y=150 هنا) وبنفس الميل. الطول ٨٢٠ مقسوم على أربع موجات
       بعرض ٢٠٥ لكل واحدة.
       ====================================================================== -->
  <defs>
    <linearGradient id="w1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A5A8C" stop-opacity=".0"/>
      <stop offset=".45" stop-color="#1C4C59" stop-opacity=".85"/>
      <stop offset="1" stop-color="#0A1F26"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9A24A" stop-opacity=".0"/>
      <stop offset=".5" stop-color="#E8A33D" stop-opacity=".55"/>
      <stop offset="1" stop-color="#C9A24A" stop-opacity=".0"/>
    </linearGradient>
  </defs>

  <!-- جسم الماء -->
  <path fill="url(#w1)"
        d="M0 150
           C 51 118, 154 118, 205 150
           C 256 182, 359 182, 410 150
           C 461 118, 564 118, 615 150
           C 666 182, 769 182, 820 150
           L820 260 L0 260 Z"/>

  <!-- بريق على سطح الموج: نفس المنحنى مرفوعاً قليلاً، بخطّ ذهبي رقيق -->
  <path fill="none" stroke="url(#w2)" stroke-width="1.6"
        d="M0 148
           C 51 116, 154 116, 205 148
           C 256 180, 359 180, 410 148
           C 461 116, 564 116, 615 148
           C 666 180, 769 180, 820 148"/>

  <!-- موجة ثانية أدقّ وأعمق، تكسر رتابة المنحنى الواحد -->
  <path fill="#0A1F26" fill-opacity=".5"
        d="M0 186
           C 68 168, 137 204, 205 186
           C 273 168, 342 204, 410 186
           C 478 168, 547 204, 615 186
           C 683 168, 752 204, 820 186
           L820 260 L0 260 Z"/>
</svg>
