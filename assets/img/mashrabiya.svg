<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- ======================================================================
       شبكة الشناشيل البغداديّة
       ----------------------------------------------------------------------
       البلاطة مبنيّة على الشبكة المعينيّة (٤٥°) التي تُخرَّط بها مشبّكات
       الشناشيل: مربّع مُدار يتكرّر، وفي تقاطعاته نجمة ثمانيّة.
       كل الإحداثيّات مضاعفات ١٢ ليكون التكرار سلساً على الحواف
       (seamless) بلا خطّ ظاهر عند الوصل.
       ====================================================================== -->
  <g fill="none" stroke="#000" stroke-width="2.1" stroke-linejoin="round">
    <!-- الشبكة المعينيّة -->
    <path d="M48 0 L96 48 L48 96 L0 48 Z"/>
    <path d="M48 24 L72 48 L48 72 L24 48 Z"/>
    <!-- أرباع المعينات على الزوايا: تكمل النقش عبر حدود البلاطة -->
    <path d="M0 0 L24 24 M96 0 L72 24 M0 96 L24 72 M96 96 L72 72"/>
    <!-- النجمة الثمانيّة في القلب -->
    <path d="M48 34 L54 42 L62 48 L54 54 L48 62 L42 54 L34 48 L42 42 Z"/>
  </g>
  <!-- زجاج ملوّن في عيون الشبكة: أربع نقاط بألوان الشُنشول -->
  <g opacity="0.55">
    <circle cx="48" cy="12" r="3.4" fill="#E8A33D"/>
    <circle cx="84" cy="48" r="3.4" fill="#A8323C"/>
    <circle cx="48" cy="84" r="3.4" fill="#1F6B52"/>
    <circle cx="12" cy="48" r="3.4" fill="#2A5A8C"/>
  </g>
</svg>
